# Default markup action definitions for the dialogue manager.
#
# Each action maps a markup name (e.g. "expression") to a ROS2 interface.
#
# Field templates:
#   #N  - use the Nth positional argument (1-based)
#   $name - use the named argument "name"
#   #N$name - try positional N first, then named "name"
#   ...|default - fallback value if the argument is not provided

expression:
  type: interaction_skills/msg/SetExpression
  path: /skill/set_expression
  fields:
    expression: "#1$name|neutral"

leds:
  type: interaction_skills/action/DoLedEffect
  path: /skill/do_led_effect
  fields:
    groups: "$groups"
    effect: "$effect|solid_color"
    duration: "$duration"
    color:
      name: "#1$color"
      alpha: "$alpha|1.0"
    secondary_color:
      name: "$secondary_color"
      alpha: "$secondary_alpha|1.0"
    cycle: "$cycle|1.0"
    partition: "$partition|1.0"

look_at:
  type: interaction_skills/action/LookAt
  path: /skill/look_at
  fields:
    policy: "$policy|glance"
    target:
      header:
        frame_id: "$frame|base_link"
      point:
        x: "$x|1.0"
        y: "#1$y"
        z: "#2$z"

motion:
  type: motion_skills/action/ReplayMotion
  path: /skill/replay_motion
  fields:
    name: "#1$name"
    skip_planning: false
