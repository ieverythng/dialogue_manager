/dialogue_manager:
  ros__parameters:
    # Chatbot node FQN - prefix for ~/prepare_dialogue and ~/dialogue_interaction
    # Empty string disables chatbot (forwards speech as RAW_USER_INPUT intent)
    chatbot: "chatbot"

    # Enable default chat while node is active
    enable_default_chat: true

    # Role for the default chat
    default_chat_role: "__default__"

    # Configuration for the default chat (JSON string)
    default_chat_configuration: ""

    # Maximum wait time for chatbot model startup (seconds)
    chatbot_startup_timeout: 30.0

    # Maximum wait time for chatbot responses (seconds)
    chatbot_response_timeout: 5.0

    # Planner completion wording mode:
    # - direct: speak planner factual text directly
    # - chatbot: chatbot_llm owns user-facing completion utterance (default)
    planner_completion_wording_mode: "chatbot"

    # Legacy override for completion wording through chatbot_llm.
    # Prefer planner_completion_wording_mode above.
    use_llm_completion_wording: false

    # Planner-owned dialogue-act topic for asynchronous execution feedback.
    planner_dialogue_act_topic: "/planner/dialogue_act"

    # Maximum execution duration for full multi-modal expression (seconds)
    multi_modal_expression_timeout: 60.0

    # Default max time for markup actions (seconds)
    markup_action_timeout: 10.0

    # Paths to YAML files defining markup actions
    markup_libraries:
      - "config/00-default_actions.yaml"

    # Markup actions to skip during expression execution
    disabled_markup_actions:
      - "motion"
