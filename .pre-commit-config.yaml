minimum_pre_commit_version: "3.5.0"

repos:
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: >-
          bash -lc '
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1;
          if [[ -f /opt/ros/jazzy/setup.bash ]]; then source /opt/ros/jazzy/setup.bash; fi;
          python3 -c "import importlib.util; required = [\"numpy\", \"chatbot_msgs\", \"diagnostic_msgs\", \"hri_actions_msgs\", \"hri_msgs\"]; raise SystemExit(0 if all(importlib.util.find_spec(name) is not None for name in required) else 1)" >/dev/null 2>&1
          || { echo \"Skipping dialogue_manager pytest: ROS test dependencies are unavailable\"; exit 0; };
          python3 -m pytest -q'
        language: system
        pass_filenames: false
